<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CastLink TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div class="brand"><span class="logo">↗</span> CastLink</div>

    <section id="home" class="screen active">
      <div class="hero">
        <div class="orb">📺</div>
        <h1>CastLink<br><span>Téléphone → TV</span></h1>
        <p>Scanne le QR Code avec ton téléphone pour prendre le contrôle.</p>
      </div>

      <div class="card">
        <label>Code de connexion</label>
        <div class="qr-area" style="text-align: center; padding: 10px;">
          <!-- Affichage direct du vrai QR Code via API -->
          <img id="qrImg" src="" alt="Génération du QR Code..." style="width:160px; height:160px; border-radius:8px; background:#fff; padding:5px; margin:auto; display:block;">
        </div>
        <div class="code-row" style="margin-top:15px;">
          <input id="room" maxlength="8" placeholder="Ex. 482931" inputmode="text">
          <button id="random" class="secondary">↻</button>
        </div>
        <button id="join" class="primary">Rejoindre le salon</button>
      </div>
    </section>

    <section id="connected" class="screen">
      <div class="topbar">
        <button id="back" class="icon">‹</button>
        <div><strong>Salon actif :</strong> <span id="roomLabel"></span></div>
      </div>

      <!-- Écran Récepteur TV -->
      <div id="tvPlayer" class="video-wrap" style="min-height: 250px; background: #000; border-radius: 12px; overflow: hidden; position: relative;">
        <div id="empty" class="empty">
          <div class="pulse">📺</div>
          <strong>En attente de contenu...</strong>
          <span>Envoie une vidéo YouTube depuis ton téléphone.</span>
        </div>
        <iframe id="ytFrame" style="display:none; width:100%; height:250px; border:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <!-- Contrôles Téléphone -->
      <div id="phoneControls" class="card" style="margin-top:15px;">
        <label>Envoyer une vidéo YouTube sur la TV</label>
        <input id="ytUrl" placeholder="Colle le lien YouTube ici..." style="margin-bottom: 10px;">
        <button id="sendYt" class="primary big">▶ Lancer la vidéo sur la TV</button>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
